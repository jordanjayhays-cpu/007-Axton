document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');cur=t.dataset.f;r()})});
document.getElementById('cf').addEventListener('change',function(e){cc=e.target.value;r()});
document.getElementById('sf').addEventListener('change',function(e){cs=e.target.value;r()});
document.getElementById('s').addEventListener('input',function(e){sq=e.target.value.toLowerCase();r()});
r();
</script>
</body>
</html>

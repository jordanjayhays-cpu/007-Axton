function markDone(id) {
  doneSet.add(id);
  localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet]));
  render();
}

function unmarkDone(id) {
  doneSet.delete(id);
  localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet]));
  render();
}

function toggleShowSent() {
  showSent = !showSent;
  render();
}

function exportCSV() {
  const rows = [["#","Studio Name","Address","Phone","Survey Link","WhatsApp Link","Sent"]];
  STUDIOS.forEach((s, i) => {
    rows.push([
      i + 1,
      s.business_name,
      s.address || "",
      s.phone || "",
      surveyLink(s),
      waLink(s) || "",
      doneSet.has(s.id) ? "YES" : "NO"
    ]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "massage-club-outreach.csv";
  a.click();
}

function render() {
  const tbody = document.getElementById("body");
  const q = search.toLowerCase();
  const visible = STUDIOS.filter(s => {
    const matchQ = !q || s.business_name.toLowerCase().includes(q) || (s.address || "").toLowerCase().includes(q);
    const matchSent = showSent || !doneSet.has(s.id);
    return matchQ && matchSent;
  });
  const sent = STUDIOS.filter(s => doneSet.has(s.id)).length;
  document.getElementById("doneCount").textContent = sent;
  document.getElementById("showSentBtn").textContent = "Show sent (" + sent + ")";

  if (visible.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="padding:40px;text-align:center;color:#999;">No studios found</td></tr>';
    return;
  }

  let counter = 0;
  tbody.innerHTML = visible.map(s => {
    const url = waLink(s);
    const sent = doneSet.has(s.id);
    counter++;
    return '<tr class="' + (sent ? "sent" : "") + '">' +
      '<td class="row-num">' + counter + '</td>' +
      '<td><div class="name">' + s.business_name + '</div><div class="address">' + (s.address || "—") + '</div></td>' +
      '<td class="phone">' + (s.phone || "—") + '</td>' +
      '<td>' + (url
        ? '<a class="wa-link" href="' + url + '" target="_blank" rel="noopener noreferrer" onclick="setTimeout(()=>markDone(\'' + s.id + '\'),1500)">' + WA_SVG + ' WhatsApp</a>'
        : '<span class="no-wa">no phone</span>'
      ) + '</td>' +
    '</tr>';
  }).join("");
}

document.getElementById("searchInput").addEventListener("input", function(e) { search = e.target.value; render(); });
render();
</script>
</body>
</html>

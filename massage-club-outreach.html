<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Massage Club · Studio Outreach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f5f5f5; min-height: 100vh; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .header p { font-size: 13px; color: #888; margin-top: 2px; }
    .counter { text-align: right; }
    .counter .num { font-size: 36px; font-weight: 800; color: #25D366; line-height: 1; }
    .counter .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }

    .search-row { margin-bottom: 16px; }
    .search { width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; color: #f5f5f5; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .search:focus { border-color: #25D366; }
    .search::placeholder { color: #555; }

    .stats { display: flex; gap: 16px; margin-bottom: 20px; font-size: 13px; color: #666; }
    .stats span { display: flex; align-items: center; gap: 5px; }

    .empty { text-align: center; padding: 60px 20px; color: #555; font-size: 15px; }
    .empty 🎉 { font-size: 40px; display: block; margin-bottom: 12px; }

    .studio { background: #161616; border: 1px solid #222; border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; transition: border-color 0.15s; }
    .studio:hover { border-color: #333; }
    .studio.sent { opacity: 0.45; }

    .info { flex: 1; min-width: 0; }
    .name { font-size: 15px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .addr { font-size: 12px; color: #555; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badges { display: flex; gap: 6px; margin-top: 6px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-active { background: #0a2e15; color: #25D366; }
    .badge-pending { background: #2e200a; color: #f5a623; }

    .wa-btn { display: flex; align-items: center; gap: 7px; padding: 10px 18px; background: #25D366; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background 0.15s, transform 0.1s; flex-shrink: 0; }
    .wa-btn:hover { background: #1da851; transform: translateY(-1px); }
    .wa-btn:active { transform: translateY(0); }
    .wa-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .done-btn { padding: 8px 14px; background: transparent; color: #444; border: 1px solid #2a2a2a; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; }
    .done-btn:hover { color: #25D366; border-color: #25D366; }
    .done-btn.marked { color: #25D366; border-color: #25D366; background: #0a2e15; }

    .no-phone { padding: 8px 14px; color: #444; font-size: 13px; border: 1px dashed #2a2a2a; border-radius: 8px; flex-shrink: 0; cursor: not-allowed; }

    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #444; margin: 20px 0 10px; font-weight: 600; }

    @media (max-width: 600px) {
      .studio { flex-wrap: wrap; }
      .done-btn { order: 3; }
    }
  </style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<script>
const MASSAGE_URL = "https://jglftdstrowwckwqmpue.supabase.co";
const MASSAGE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZGZ0ZHN0cm93d2NrdXdxcHVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYxMjQ4MDAsImV4cCI6MjA1MTcwMDgwMH0.MnjpGfslbLNJCTiOOPrlNPFDT45FkDwlH1PERhRjQzU";
const SURVEY_URL = "https://your-massage-pass-o5fo.vercel.app/survey/studios";
const DONE_KEY = "mc_outreach_v1_done";

const MSG_TPL = (name) =>
  `¡Hola! 👋 Somos Massage Club — una app que reúne a los mejores estudios de masaje de Madrid en un solo lugar. Estamos creando una red de studios partners para ofrecer a los clientes reserva directa, disponibilidad en tiempo real y más clientes nuevos. ¿Te gustaría aparecer en la plataforma? Takes solo 2 minutos: 👉 ${SURVEY_URL}?utm_source=whatsapp&utm_campaign=studio_outreach&utm_content=${encodeURIComponent(name)}\n\nUn saludo,\nDaniel — Massage Club`;

function waURL(phone, name) {
  if (!phone) return null;
  const num = phone.replace(/\s/g, "").replace(/^00/, "+");
  return `https://wa.me/${num.replace(/^\+/, "")}?text=${encodeURIComponent(MSG_TPL(name))}`;
}

const WA_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.478 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.06 6.988 2.943a9.84 9.84 0 012.893 6.807c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

let studios = [];
let doneSet = new Set();
let filter = "";

function render() {
  const app = document.getElementById("app");
  const pending = studios.filter(s => s.status === "pending");
  const active = studios.filter(s => s.status === "active");
  const unseen = studios.filter(s => !doneSet.has(s.id) && (s.business_name.toLowerCase().includes(filter.toLowerCase()) || (s.address || "").toLowerCase().includes(filter.toLowerCase())));
  const sent = studios.filter(s => doneSet.has(s.id));

  let html = `
    <div class="header">
      <div>
        <h1>📲 Studio Outreach</h1>
        <p>One tap → WhatsApp opens with pre-filled message</p>
      </div>
      <div class="counter">
        <div class="num">${doneSet.size}</div>
        <div class="label">sent / ${studios.length}</div>
      </div>
    </div>

    <div class="search-row">
      <input class="search" placeholder="Search studios…" value="${filter.replace(/"/g, '&quot;')}" oninput="filter=this.value; render()" />
    </div>

    <div class="stats">
      <span>🟢 ${active.length} active</span>
      <span>🟡 ${pending.length} pending</span>
      <span>${unseen.length} showing</span>
      ${sent.length ? `<span style="margin-left:auto">✓ ${sent.length} sent</span>` : ""}
    </div>
  `;

  if (studios.length === 0) {
    html += `<div class="empty">Loading studios…</div>`;
  } else if (unseen.length === 0) {
    html += `<div class="empty"><span style="font-size:40px">🎉</span>All done! Every studio has been contacted.</div>`;
  } else {
    html += unseen.map(s => {
      const url = waURL(s.phone, s.business_name);
      return `
        <div class="studio">
          <div class="info">
            <div class="name">${s.business_name}</div>
            <div class="addr">${s.address || "—"}</div>
            <div class="badges">
              <span class="badge ${s.status === "active" ? "badge-active" : "badge-pending"}">${s.status}</span>
              ${!s.phone ? "<span class='badge' style='background:#1a0a0a;color:#e55;'>no phone</span>" : ""}
            </div>
          </div>
          ${url
            ? `<a class="wa-btn" href="${url}" target="_blank" rel="noopener noreferrer" onclick="setTimeout(()=>markDone('${s.id}'),2000)">${WA_SVG} WhatsApp</a>`
            : `<span class="no-phone">no phone</span>`
          }
          <button class="done-btn ${doneSet.has(s.id) ? "marked" : ""}" onclick="markDone('${s.id}')">✓ Done</button>
        </div>
      `;
    }).join("");
  }

  if (sent.length > 0 && filter) {
    html += `<div class="section-title">Sent (${sent.length})</div>`;
    html += sent.slice(0, 5).map(s => `
      <div class="studio sent">
        <div class="info">
          <div class="name">${s.business_name}</div>
          <div class="addr">${s.address || "—"}</div>
        </div>
        <button class="done-btn marked" onclick="unmarkDone('${s.id}')">↩ Undo</button>
      </div>
    `).join("");
  }

  app.innerHTML = html;
}

function markDone(id) {
  doneSet.add(id);
  localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet]));
  render();
}

function unmarkDone(id) {
  doneSet.delete(id);
  localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet]));
  render();
}

async function init() {
  doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
  try {
    const r = await fetch(\`\${MASSAGE_URL}/rest/v1/partners?select=id,business_name,address,phone,status&order=business_name.asc\`, {
      headers: { apikey: MASSAGE_KEY, Authorization: \`Bearer \${MASSAGE_KEY}\` }
    });
    studios = await r.json();
  } catch(e) {
    document.getElementById("app").innerHTML = \`<div class="empty">Failed to load studios. Refresh to retry.<br><br><small>\${e.message}</small></div>\`;
    return;
  }
  render();
}

init();
</script>
</body>
</html>

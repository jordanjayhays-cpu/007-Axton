const CONTACTED = JSON.parse(localStorage.getItem('mc_contacted') || '{}');
const SURVEY = JSON.parse(localStorage.getItem('mc_survey') || '{}');

function fmtPhone(raw) {
  if (!raw) return '';
  return raw.replace(/[^0-9]/g, '');
}

function buildWAUrl(phone, studio) {
  const num = fmtPhone(phone);
  if (!num) return '#';
  const msg = `Hola ${studio}, somos Massage Club Madrid 👋 Somos una red de estudios de masaje en la ciudad. Nos encantaría invitarte a formar parte de nuestra red — es gratis para estudios. Completa nuestra encuesta: https://your-massage-pass-o5fo.vercel.app/survey/studios`;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

function render(rows) {
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('count-bar').textContent = `Showing ${rows.length} of ${DATA.length} studios`;
  document.getElementById('contacted-num').textContent = Object.keys(CONTACTED).length;
  document.getElementById('survey-num').textContent = Object.keys(SURVEY).length;

  rows.forEach(s => {
    const hasPhone = !!s.phone;
    const waBtn = hasPhone
      ? `<a href="${buildWAUrl(s.phone, s.name)}" target="_blank" class="wa-btn">${s.phone}</a>`
      : `<span style="color:#ef4444;font-size:11px"><span class="dot"></span>Missing</span>`;
    
    const svcHtml = ['Relajante','Terapeutico','Deportivo','Thai','Pareja'].map(t => {
      const key = 'has_' + t.toLowerCase().replace(/á/,'a').replace(/ñ/,'n');
      const on = s[key];
      return `<span class="svc-pill ${on ? 'on' : ''}">${t}</span>`;
    }).join('');

    const contactedChecked = CONTACTED[s.id] ? 'checked' : '';
    const surveyChecked = SURVEY[s.id] ? 'checked' : '';
    const rowClass = hasPhone ? '' : 'no-phone';

    document.getElementById('tbody').innerHTML += `
<tr class="${rowClass}" data-id="${s.id}">
  <td>
    <div class="name">${s.name}</div>
    <div class="address">${s.address}</div>
    <div class="svc">${svcHtml}</div>
  </td>
  <td><span class="badge badge-${s.status}">${s.status}</span></td>
  <td style="color:#64748b;font-size:11px">${s.service_count} services</td>
  <td>${waBtn}</td>
  <td><input type="checkbox" ${contactedChecked} onchange="saveContacted('${s.id}', this.checked)"></td>
  <td><input type="checkbox" ${surveyChecked} onchange="saveSurvey('${s.id}', this.checked)"></td>
</tr>`;
  });
}

function saveContacted(id, val) {
  if (val) CONTACTED[id] = true; else delete CONTACTED[id];
  localStorage.setItem('mc_contacted', JSON.stringify(CONTACTED));
  document.getElementById('contacted-num').textContent = Object.keys(CONTACTED).length;
}

function saveSurvey(id, val) {
  if (val) SURVEY[id] = true; else delete SURVEY[id];
  localStorage.setItem('mc_survey', JSON.stringify(SURVEY));
  document.getElementById('survey-num').textContent = Object.keys(SURVEY).length;
}

let currentFilter = 'all';

document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    
    let rows = DATA;
    if (currentFilter === 'contacted') rows = DATA.filter(s => CONTACTED[s.id]);
    else if (currentFilter === 'survey-done') rows = DATA.filter(s => SURVEY[s.id]);
    else if (currentFilter === 'no-phone') rows = DATA.filter(s => !s.phone);
    else if (currentFilter === 'has-thai') rows = DATA.filter(s => s.has_thai);
    else if (currentFilter === 'has-pareja') rows = DATA.filter(s => s.has_pareja);
    
    render(rows);
  });
});

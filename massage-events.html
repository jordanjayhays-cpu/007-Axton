<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massage Club — Event Outreach | Upcoming 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .header p { font-size: 14px; color: #64748b; }
    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .stat {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 24px;
      text-align: center;
    }
    .stat .number { font-size: 28px; font-weight: 700; color: #38bdf8; }
    .stat .label { font-size: 12px; color: #64748b; margin-top: 2px; }
    .contacts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .contact-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s;
    }
    .contact-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .contact-card.hot { border-color: #f97316; box-shadow: 0 0 20px #f9731630; }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.hot { background: #f9731620; color: #fb923c; border: 1px solid #f9731640; }
    .badge.warm { background: #38bdf820; color: #38bdf8; border: 1px solid #38bdf840; }
    .contact-name { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .contact-org { font-size: 13px; color: #64748b; margin-bottom: 12px; }
    .contact-dates {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .date-chip {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .date-chip.soon {
      border-color: #f9731660;
      color: #fb923c;
      background: #f9731610;
    }
    .contact-email {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #38bdf8;
      font-family: monospace;
    }
    .contact-email a { color: inherit; text-decoration: none; }
    .copy-btn {
      margin-left: auto;
      background: #334155;
      border: none;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-btn:hover { background: #475569; color: #e2e8f0; }
    .contact-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .meta-tag { font-size: 11px; background: #0f172a; color: #475569; padding: 4px 8px; border-radius: 6px; }
    .contact-actions { display: flex; gap: 8px; }
    .action-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
      text-decoration: none;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-btn.primary { background: #38bdf8; color: #0f172a; }
    .action-btn.primary:hover { background: #7dd3fc; }
    .action-btn.secondary { background: #334155; color: #e2e8f0; }
    .action-btn.secondary:hover { background: #475569; }
    .email-template { max-width: 700px; margin: 40px auto 0; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; }
    .email-template h3 { font-size: 14px; font-weight: 600; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .email-template textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      min-height: 160px;
      font-family: monospace;
    }
    .section-title { text-align: center; font-size: 13px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 1px; margin: 40px 0 20px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 480px) { .contacts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <h1>📅 Massage Club — Upcoming Events Outreach</h1>
  <p>Madrid & Spain · Only confirmed 2026 dates · Public contact emails</p>
</div>

<div class="stats">
  <div class="stat"><div class="number">2</div><div class="label">Organizers</div></div>
  <div class="stat"><div class="number">4</div><div class="label">Confirmed 2026 Events</div></div>
  <div class="stat"><div class="number">2</div><div class="label">🔥 Hot Priority</div></div>
</div>

<div class="contacts-grid" id="contactsGrid"></div>

<div class="section-title">📧 Email Template</div>
<div class="email-template">
  <h3>Tu mensaje — personalizado para cada evento</h3>
  <textarea id="emailBody">Asunto: Oportunidad para Wellbeing Summit — Niah AI Networking

Hola [Nombre],

Te escribo porque estamos buscando eventos B2B en Madrid para un piloto gratuito de Niah — nuestra tecnología de networking con inteligencia artificial.

Niah permite a los asistentes de un evento encontrarse con exactly who they need to meet *antes* de que empiece. Esto significa:
  • Más conversaciones de negocio reales durante el evento
  • Mayor satisfacción de asistentes (medida con datos)
  • Leads cualificados para ustedes como organizadores

Estamos ofreciendo un piloto gratuito para 2-3 eventos seleccionados este semestre. 

Vi que organizan [EVENTO] el [FECHA] — ¿estarían abiertos a explorar cómo Niah podría añadir valor?

¿Podemos hablar esta semana? 15 minutos.

Saludos,
Jordan</textarea>
  <div style="display:flex;gap:8px;margin-top:12px;">
    <button class="action-btn primary" onclick="copyEmail()" style="flex:1">📋 Copiar email completo</button>
    <button class="action-btn secondary" onclick="customizeEmail()">✏️ Personalizar para este evento</button>
  </div>
</div>

<div class="toast" id="toast">¡Copiado!</div>

<script>
const contacts = [
  {
    id: 1,
    name: "Wellbeing Summit",
    org: "Intrama",
    email: "info@intrama.es",
    priority: "hot",
    dates: ["16 Jun 2026"],
    location: "Madrid",
    notes: "5ª Edición · El mayor congreso nacional de Salud Laboral y Bienestar Corporativo. Altísimo valor B2B — los asistentes son exactamente los decision-makers que pagan por Niah.",
    url: "https://www.intrama.es/wellbeingsummit",
  },
  {
    id: 2,
    name: "DEI Summit",
    org: "Intrama",
    email: "info@intrama.es",
    priority: "hot",
    dates: ["20 Oct 2026"],
    location: "Madrid",
    notes: "En el marco de Intrama · Congreso profesional de referencia en DEI y bienestar corporativo.",
    url: "https://www.intrama.es/eventos",
  },
  {
    id: 3,
    name: "EX Future Summit",
    org: "Intrama",
    email: "info@intrama.es",
    priority: "warm",
    dates: ["10 Nov 2026"],
    location: "Madrid",
    notes: "En el marco de Intrama · Futuro del trabajo y bienestar empresarial.",
    url: "https://www.intrama.es/eventos",
  },
  {
    id: 4,
    name: "Bienestar en Eventos Corporativos",
    org: "The Vital Touch (TVT Barcelona)",
    email: "hello@thevitaltouch.es",
    priority: "warm",
    dates: ["Ene–Abr 2026"],
    location: "Barcelona",
    notes: "Servicios de bienestar para eventos corporativos en Barcelona. Posible partner para llevar Niah a eventos empresariales catalanes.",
    url: "https://www.tvtbarcelona.com/bienestar-en-eventos/",
  },
];

function renderContacts() {
  const grid = document.getElementById('contactsGrid');
  const today = new Date();
  grid.innerHTML = contacts.map(c => {
    const isSoon = c.dates.some(d => {
      const m = d.match(/(Jun|Oct|Nov)\s+(\d+)\s+2026/);
      if (!m) return false;
      const mo = {Jun: 5, Oct: 9, Nov: 10}[m[1]];
      const day = parseInt(m[2]);
      return new Date(2026, mo, day) > today;
    });
    return `
    <div class="contact-card ${c.priority === 'hot' ? 'hot' : ''}">
      <div class="card-header">
        <span class="badge ${c.priority}">${c.priority === 'hot' ? '🔥 Hot' : '💬 Warm'}</span>
        <span style="font-size:11px;color:#475569;">${c.location}</span>
      </div>
      <div class="contact-name">${c.name}</div>
      <div class="contact-org">${c.org}</div>
      <div class="contact-dates">
        ${c.dates.map(d => `<span class="date-chip ${isSoon ? 'soon' : ''}">📅 ${d}</span>`).join('')}
      </div>
      <div class="contact-email">
        <a href="mailto:${c.email}">${c.email}</a>
        <button class="copy-btn" onclick="copyEmail('${c.email}')">Copy</button>
      </div>
      <div class="contact-meta">
        <span class="meta-tag">📍 ${c.location}</span>
        <span class="meta-tag">🏢 ${c.org}</span>
      </div>
      <div class="contact-notes" style="font-size:13px;color:#94a3b8;line-height:1.5;margin-bottom:14px;font-style:italic;">"${c.notes}"</div>
      <div class="contact-actions">
        <a href="mailto:${c.email}?subject=Oportunidad%20Niah%20-%20Networking%20AI%20%5B${encodeURIComponent(c.name)}%5D&body=${encodeURIComponent(document.getElementById('emailBody').value)}" class="action-btn primary">
          ✉️ Enviar email
        </a>
        <a href="${c.url}" target="_blank" class="action-btn secondary">🌐 Web</a>
      </div>
    </div>
    `;
  }).join('');
}

function copyEmail(text) {
  if (!text) text = document.getElementById('emailBody').value;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

function customizeEmail() {
  const name = prompt('Nombre del contacto (o deja en blanco para "equipo"):') || 'equipo';
  const event = prompt('Nombre del evento:') || '';
  const date = prompt('Fecha del evento:') || '';
  if (!event) return;
  const tpl = document.getElementById('emailBody').value;
  const out = tpl.replace('[Nombre]', name).replace('[EVENTO]', event).replace('[FECHA]', date);
  document.getElementById('emailBody').value = out;
  copyEmail(out);
}

renderContacts();
</script>

</body>
</html>
